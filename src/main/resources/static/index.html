<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Книга рецептов</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Минимальные стили для поля состава, чтобы не ломать верстку */
        .form-group { margin: 12px 0; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 500; }
        #p-composition {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            box-sizing: border-box;
        }
        #p-composition:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Книга рецептов</h1>

    <!-- ================= ТАБЫ ================= -->
    <div class="tabs">
        <button onclick="showTab('products')">Продукты</button>
        <button onclick="showTab('dishes')">Блюда</button>
    </div>

    <!-- ================= ПРОДУКТЫ ================= -->
    <section id="products-section">

        <h2>Продукты</h2>

        <!-- фильтры -->
        <div class="filters">
            <select id="filter-category">
                <option value="">Все категории</option>
                <option value="FROZEN">Замороженный</option>
                <option value="MEAT">Мясной</option>
                <option value="VEGETABLES">Овощи</option>
                <option value="GREENS">Зелень</option>
                <option value="SPICES">Специи</option>
                <option value="GRAINS">Крупы</option>
                <option value="CANNED">Консервы</option>
                <option value="LIQUID">Жидкость</option>
                <option value="SWEETS">Сладости</option>
            </select>

            <select id="filter-cooking">
                <option value="">Любое</option>
                <option value="READY_TO_EAT">Готовый</option>
                <option value="SEMI_FINISHED">Полуфабрикат</option>
                <option value="REQUIRES_COOKING">Требует готовки</option>
            </select>

            <input id="product-search" placeholder="Поиск...">

            <label><input type="checkbox" id="p-f-vegan" onchange="loadProducts()"> Веган</label>
            <label><input type="checkbox" id="p-f-gluten" onchange="loadProducts()"> Без глютена</label>
            <label><input type="checkbox" id="p-f-sugar" onchange="loadProducts()"> Без сахара</label>

            <select id="sort">
                <option value="name,asc">Имя ↑</option>
                <option value="name,desc">Имя ↓</option>
                <option value="calories,asc">Ккал ↑</option>
                <option value="calories,desc">Ккал ↓</option>
                <option value="proteins,desc">Белки ↓</option>
                <option value="fats,desc">Жиры ↓</option>
                <option value="carbohydrates,desc">Углеводы ↓</option>
            </select>

            <button type="button" onclick="loadProducts()">Применить</button>
        </div>

        <!-- форма продукта -->
        <form id="product-form">

            <input id="p-name" placeholder="Название" required>

            <p>Калории</p>
            <input id="p-calories" type="number" placeholder="Ккал" required>
            <p>Белки</p>
            <input id="p-proteins" type="number" placeholder="Белки" required>
            <p>Жиры</p>
            <input id="p-fats" type="number" placeholder="Жиры" required>
            <p>Углеводы</p>
            <input id="p-carbs" type="number" placeholder="Углеводы" required>

            <!-- 🔹 ПОЛЕ СОСТАВА ПРОДУКТА -->
            <div class="form-group">
                <label for="p-composition">Состав (описание):</label>
                <textarea
                        id="p-composition"
                        name="composition"
                        rows="3"
                        placeholder="Перечислите ингредиенты, например: молоко, сахар, ванилин..."
                ></textarea>
            </div>

            <div class="flags">
                <label>
                    <input type="checkbox" value="VEGAN" class="p-flag"> Веган
                </label>

                <label>
                    <input type="checkbox" value="GLUTEN_FREE" class="p-flag"> Без глютена
                </label>

                <label>
                    <input type="checkbox" value="SUGAR_FREE" class="p-flag"> Без сахара
                </label>
            </div>

            <select id="p-category">
                <option value="FROZEN">Замороженный</option>
                <option value="MEAT">Мясной</option>
                <option value="VEGETABLES">Овощи</option>
                <option value="GREENS">Зелень</option>
                <option value="SPICES">Специи</option>
                <option value="GRAINS">Крупы</option>
                <option value="CANNED">Консервы</option>
                <option value="LIQUID">Жидкость</option>
                <option value="SWEETS">Сладости</option>
            </select>

            <select id="p-cooking">
                <option value="READY_TO_EAT">Готовый</option>
                <option value="SEMI_FINISHED">Полуфабрикат</option>
                <option value="REQUIRES_COOKING">Требует готовки</option>
            </select>

            <input type="file" id="p-photo" multiple accept="image/*">
            <div id="p-photo-preview" class="photo-preview"></div>

            <img id="preview" class="preview hidden">

            <button type="button" id="save-product-btn" onclick="saveProduct()">Сохранить продукт</button>
            <button type="button" onclick="cancelEditProduct()">Отмена</button>

        </form>

        <!-- список -->
        <div id="products-list"></div>

    </section>

    <!-- ================= БЛЮДА ================= -->
    <section id="dishes-section" class="hidden">

        <h2>Блюда</h2>

        <form id="dish-form">

            <input id="d-name" placeholder="Название блюда" required>
            <select id="d-category">
                <option value="">Категория (из названия или вручную)</option>
                <option value="DESSERT">Десерт</option>
                <option value="FIRST">Первое</option>
                <option value="SECOND">Второе</option>
                <option value="DRINK">Напиток</option>
                <option value="SALAD">Салат</option>
                <option value="SOUP">Суп</option>
                <option value="SNACK">Перекус</option>
            </select>
            <input id="d-portion" type="number" placeholder="Размер порции (г)" required>

            <div id="ingredients"></div>

            <button type="button" onclick="addIngredientRow()">Добавить ингредиент</button>

            <div class="macros">
                <p>Калории</p>
                <input id="d-calories" placeholder="Ккал">
                <p>Белки</p>
                <input id="d-proteins" placeholder="Белки">
                <p>Жиры</p>
                <input id="d-fats" placeholder="Жиры">
                <p>Углеводы</p>
                <input id="d-carbs" placeholder="Углеводы">
            </div>

            <hr>
            <p>Поиск</p>
            <!-- 🔽 ФИЛЬТРЫ БЛЮД -->
            <div>
                <!-- 🔎 ПОИСК БЛЮД -->
                <div class="dish-search-block">
                    <input id="dish-search" placeholder="Поиск блюда...">
                    <button type="button" onclick="loadDishes()">Найти</button>
                </div>

                <select id="dish-category" onchange="loadDishes()">
                    <option value="">Все категории</option>
                    <option value="DESSERT">Десерт</option>
                    <option value="FIRST">Первое</option>
                    <option value="SECOND">Второе</option>
                    <option value="DRINK">Напиток</option>
                    <option value="SALAD">Салат</option>
                    <option value="SOUP">Суп</option>
                    <option value="SNACK">Перекус</option>
                </select>

                <label><input type="checkbox" id="f-vegan" onchange="loadDishes()"> Веган</label>
                <label><input type="checkbox" id="f-gluten" onchange="loadDishes()"> Без глютена</label>
                <label><input type="checkbox" id="f-sugar" onchange="loadDishes()"> Без сахара</label>
            </div>
            <hr>
            <p>Фото</p>
            <input type="file" id="d-photo" multiple accept="image/*">
            <div id="d-photo-preview" class="photo-preview"></div>

            <img id="d-preview" class="preview hidden">

            <button type="button" onclick="saveDish()">Сохранить блюдо</button>
            <button type="button" onclick="cancelEditDish()">Отмена</button>

            <!-- FLAGS BLOCK (DISHE FORM) -->
            <div class="flags">
                <label>
                    <input type="checkbox" class="d-flag" value="VEGAN"> Веган
                </label>

                <label>
                    <input type="checkbox" class="d-flag" value="GLUTEN_FREE"> Без глютена
                </label>

                <label>
                    <input type="checkbox" class="d-flag" value="SUGAR_FREE"> Без сахара
                </label>
            </div>

        </form>

        <div id="dishes-list"></div>
    </section>

    <!-- ================= ДЕТАЛКА ПРОДУКТА ================= -->
    <section id="product-detail-section" class="hidden">
        <button onclick="closeProductView()">← Назад</button>
        <div id="product-detail"></div>
    </section>

    <!-- ================= ДЕТАЛКА БЛЮДА ================= -->
    <section id="dish-detail-section" class="hidden">
        <button onclick="closeDishView()">← Назад</button>
        <div id="dish-detail"></div>
    </section>

</div>

<script src="app.js"></script>

</body>
</html>

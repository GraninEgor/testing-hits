spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      location: ${java.io.tmpdir}

# Путь для загрузки файлов в тестах
app:
  upload-dir: ${test.upload-dir:uploads/}

logging:
  level:
    org.example.recipebook: DEBUG
    org.hibernate.SQL: DEBUG